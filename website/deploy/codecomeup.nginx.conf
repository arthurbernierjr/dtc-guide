# First host: codecomeup.thelinkfor.me
# After codecomeup.com DNS exists, add it to server_name and issue a certificate
# for that name. Then change origin in build/site.config.js and rebuild so the
# canonical and share tags name the new host. Nginx alone does not rewrite them.

server {
  listen 443 ssl;
  server_name codecomeup.thelinkfor.me;
  # later, after DNS: codecomeup.com www.codecomeup.com

  location / {
    proxy_pass http://127.0.0.1:31803;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
