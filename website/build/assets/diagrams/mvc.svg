<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13">
  <rect width="760" height="300" rx="14" fill="#111114"/>
  <rect x="300" y="30" width="160" height="80" rx="12" fill="#16161A" stroke="#E8D800" stroke-width="1.5"/>
  <text x="380" y="62" fill="#E8D800" text-anchor="middle" letter-spacing="2">CONTROLLER</text>
  <text x="380" y="86" fill="#8A8A94" text-anchor="middle" font-size="11">decides what happens</text>
  <rect x="60" y="180" width="200" height="80" rx="12" fill="#16161A" stroke="#00A868" stroke-width="1.5"/>
  <text x="160" y="212" fill="#00A868" text-anchor="middle" letter-spacing="2">MODEL</text>
  <text x="160" y="236" fill="#8A8A94" text-anchor="middle" font-size="11">data + rules · talks to the DB</text>
  <rect x="500" y="180" width="200" height="80" rx="12" fill="#16161A" stroke="#F03038" stroke-width="1.5"/>
  <text x="600" y="212" fill="#F03038" text-anchor="middle" letter-spacing="2">VIEW</text>
  <text x="600" y="236" fill="#8A8A94" text-anchor="middle" font-size="11">what the user sees</text>
  <g stroke="#8A8A94" stroke-width="1.5" fill="none">
    <path d="M330 110 L190 180"/><path d="M196 168 L186 182 L202 182"/>
    <path d="M430 110 L570 180"/><path d="M558 182 L574 182 L564 168"/>
    <path d="M260 220 H500" stroke-dasharray="4 4"/>
  </g>
  <text x="230" y="140" fill="#8A8A94" font-size="11">asks for / updates data</text>
  <text x="440" y="140" fill="#8A8A94" font-size="11">hands data to render</text>
  <text x="380" y="210" fill="#8A8A94" text-anchor="middle" font-size="11">the view never queries the model directly</text>
  <text x="380" y="284" fill="#8A8A94" text-anchor="middle" font-size="11">request → router → controller → model → controller → view → response</text>
</svg>
