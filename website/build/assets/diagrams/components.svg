<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13">
  <rect width="760" height="320" rx="14" fill="#111114"/>
  <rect x="40" y="30" width="680" height="260" rx="12" fill="#16161A" stroke="#00A868" stroke-width="1.5"/>
  <text x="56" y="54" fill="#00A868" font-size="11" letter-spacing="2">&lt;App /&gt;</text>
  <rect x="60" y="70" width="640" height="50" rx="8" fill="#111114" stroke="#E8D800"/>
  <text x="76" y="100" fill="#E8D800">&lt;Nav /&gt;</text><text x="300" y="100" fill="#8A8A94" font-size="11">props: user, onLogout</text>
  <rect x="60" y="134" width="300" height="136" rx="8" fill="#111114" stroke="#F03038"/>
  <text x="76" y="160" fill="#F03038">&lt;PostList posts={posts} /&gt;</text>
  <rect x="76" y="176" width="268" height="36" rx="6" fill="#16161A" stroke="#2A2A30"/><text x="90" y="199" fill="#EAE6E1" font-size="12">&lt;PostCard post={p} /&gt;</text>
  <rect x="76" y="220" width="268" height="36" rx="6" fill="#16161A" stroke="#2A2A30"/><text x="90" y="243" fill="#EAE6E1" font-size="12">&lt;PostCard post={p} /&gt;</text>
  <rect x="380" y="134" width="320" height="136" rx="8" fill="#111114" stroke="#F03038"/>
  <text x="396" y="160" fill="#F03038">&lt;NewPostForm onSave={add} /&gt;</text>
  <text x="396" y="196" fill="#8A8A94" font-size="11">state lives in App; children get props</text>
  <text x="396" y="216" fill="#8A8A94" font-size="11">events flow up through callbacks</text>
  <text x="396" y="236" fill="#8A8A94" font-size="11">each box re-renders when its props change</text>
  <text x="380" y="308" fill="#8A8A94" text-anchor="middle" font-size="11">component-driven development: small, named, reusable pieces composed into a tree</text>
</svg>
